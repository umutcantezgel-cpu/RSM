<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @font-face{font-family:'Inter';src:url('fonts/inter-variable-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'Outfit';src:url('fonts/outfit-variable-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
</style>
</helmet>
<nav style="font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:space-between;gap:24px;height:78px;max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,40px)">
  <a href="Home.dc.html" style="display:flex;align-items:center;gap:13px;text-decoration:none;flex-shrink:0">
    <img src="assets/rsm-logo.jpg" alt="RSM Systembau GmbH" style="height:30px;width:auto;display:block;mix-blend-mode:multiply" />
    <span style="height:24px;width:1px;background:#d4d4d8"></span>
    <span style="font-size:10px;font-weight:600;letter-spacing:.2em;color:#a1a1aa;white-space:nowrap">RT HOLDING<br>GROUP</span>
  </a>

  <div style="display:flex;align-items:center;gap:2px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
      <a href="{{ l.href }}" style="{{ l.style }}">
        <span style="font-size:10px;font-weight:600;color:{{ l.numColor }};letter-spacing:.1em">{{ l.num }}</span>
        {{ l.name }}
      </a>
    </sc-for>
  </div>

  <a href="Portal.dc.html" style="display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:16px;text-decoration:none;font-family:'Outfit';font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#18181b;border:1.5px solid #18181b;background:transparent;transition:all .25s;flex-shrink:0" style-hover="background:#18181b;color:#fafafa">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Portal
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:78},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;unternehmen&quot;,&quot;leistungen&quot;,&quot;referenzen&quot;,&quot;karriere&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const items = [
      { key: 'home', name: 'Start', href: 'Home.dc.html', num: '01' },
      { key: 'unternehmen', name: 'Unternehmen', href: 'Unternehmen.dc.html', num: '02' },
      { key: 'leistungen', name: 'Leistungen', href: 'Leistungen.dc.html', num: '03' },
      { key: 'referenzen', name: 'Referenzen', href: 'Referenzen.dc.html', num: '04' },
      { key: 'karriere', name: 'Karriere', href: 'Karriere.dc.html', num: '05' },
    ];
    const links = items.map(it => {
      const on = it.key === active;
      return {
        ...it,
        numColor: on ? '#3f73a3' : '#d4d4d8',
        style: "display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;text-decoration:none;font-family:'Outfit';font-weight:" + (on ? '700' : '500') + ";font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:" + (on ? '#18181b' : '#52525b') + ";background:" + (on ? '#f4f4f5' : 'transparent') + ";transition:all .2s",
      };
    });
    return { links };
  }
}
</script>
</body>
</html>
